name: Build FloppyKernel XXKSU + NetHunter WiFi (Ginkgo)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.0
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex libssl-dev libelf-dev \
            libncurses-dev python3 zip curl ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fix Script Permissions
        run: |
          chmod +x build/ckbuild.sh
          chmod +x build/scripts/*.sh
          chmod +x build/lib/*.sh 2>/dev/null || true

      - name: Download NetHunter Patches
        run: |
          mkdir -p patches/nethunter
          
          echo "📥 Downloading NetHunter patches for kernel 4.14..."
          echo ""
          
          curl -L -o patches/nethunter/001-add-qcacld-3.0-injection-4.14.patch \
            "https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder/-/raw/main/patches/4.14/add-qcacld-3.0-injection-4.14.patch" \
            && echo "✅ Downloaded: add-qcacld-3.0-injection-4.14.patch" \
            || echo "⚠️ Failed: add-qcacld-3.0-injection-4.14.patch"
          
          curl -L -o patches/nethunter/002-add-wifi-injection-4.14.patch \
            "https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder/-/raw/main/patches/4.14/add-wifi-injection-4.14.patch" \
            && echo "✅ Downloaded: add-wifi-injection-4.14.patch" \
            || echo "⚠️ Failed: add-wifi-injection-4.14.patch"
          
          curl -L -o patches/nethunter/003-add-rtw88-drivers-4.14.patch \
            "https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder/-/raw/main/patches/4.14/add-rtw88-drivers-4.14.patch" \
            && echo "✅ Downloaded: add-rtw88-drivers-4.14.patch" \
            || echo "⚠️ Failed: add-rtw88-drivers-4.14.patch"
          
          echo ""
          echo "📋 Downloaded patches:"
          ls -lh patches/nethunter/*.patch 2>/dev/null || echo "No patches"

      - name: Apply NetHunter Patches
        run: |
          cd "$GITHUB_WORKSPACE"
          APPLIED=0
          FAILED=0
          FAILED_LIST=()
          
          echo "🔧 Applying NetHunter patches..."
          echo "========================================="
          
          for patch_file in patches/nethunter/*.patch; do
            [ -f "$patch_file" ] || continue
            patch_name=$(basename "$patch_file")
            echo ""
            echo "📌 Processing: $patch_name"
            
            # Try -p1 first
            if patch -p1 --dry-run < "$patch_file" &>/dev/null; then
              echo "✅ Dry-run OK with -p1, applying..."
              if patch -p1 < "$patch_file"; then
                echo "✅ Successfully Applied: $patch_name"
                ((APPLIED++))
              else
                echo "❌ FAILED to apply: $patch_name (with -p1)"
                FAILED_LIST+=("$patch_name (p1)")
                ((FAILED++))
              fi
            # Try -p0
            elif patch -p0 --dry-run < "$patch_file" &>/dev/null; then
              echo "✅ Dry-run OK with -p0, applying..."
              if patch -p0 < "$patch_file"; then
                echo "✅ Successfully Applied (p0): $patch_name"
                ((APPLIED++))
              else
                echo "❌ FAILED to apply: $patch_name (with -p0)"
                FAILED_LIST+=("$patch_name (p0)")
                ((FAILED++))
              fi
            else
              echo "❌ INCOMPATIBLE: $patch_name"
              echo "   (neither -p1 nor -p0 dry-run passed)"
              FAILED_LIST+=("$patch_name (incompatible)")
              ((FAILED++))
            fi
          done
          
          echo ""
          echo "========================================="
          echo "📊 PATCH APPLICATION SUMMARY:"
          echo "✅ Applied: $APPLIED"
          echo "❌ Failed/Skipped: $FAILED"
          if [ ${#FAILED_LIST[@]} -gt 0 ]; then
            echo ""
            echo "Failed patches:"
            for p in "${FAILED_LIST[@]}"; do
              echo "  ❌ $p"
            done
          fi
          echo "========================================="
          
          # Exit with error if any patches failed
          if [ "$FAILED" -gt 0 ]; then
            echo ""
            echo "⚠️ Warning: Some patches failed to apply"
            exit 1
          fi

      - name: Build Kernel (XXKSU + NetHunter WiFi)
        run: |
          export WP="$(realpath "$PWD/..")"
          echo ""
          echo "🚀 Building FloppyKernel XXKSU + NetHunter WiFi..."
          echo "Device: Ginkgo (Redmi Note 8)"
          echo "Variant: XXKSU with WiFi Injection"
          echo "========================================="
          echo ""
          bash build/ckbuild.sh ginkgo x

      - name: Upload Artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: FloppyKernel-XXKSU-NetHunter-WiFi-Ginkgo
          path: build/Floppy_*.zip
          if-no-files-found: error
          overwrite: true

      - name: Build Summary
        if: always()
        run: |
          echo ""
          echo "🎉 Build Workflow Complete!"
          echo "========================================="
          echo "Device: Ginkgo (Redmi Note 8)"
          echo "Variant: XXKSU + NetHunter WiFi Injection"
          echo "Patches Applied:"
          echo "  ✅ QCACLD 3.0 WiFi Injection"
          echo "  ✅ WiFi Injection (Monitor Mode Support)"
          echo "  ✅ RTW88 WiFi Driver Support"
          echo "========================================="
          echo ""
          echo "Artifacts available in Actions > Artifacts section"
