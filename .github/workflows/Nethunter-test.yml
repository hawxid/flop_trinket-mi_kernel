name: Build FloppyKernel XXKSU + NetHunter WiFi (Ginkgo)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex libssl-dev libelf-dev \
            libncurses-dev python3 zip curl ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fix Script Permissions
        run: |
          chmod +x build/ckbuild.sh
          chmod +x build/scripts/*.sh
          chmod +x build/lib/*.sh 2>/dev/null || true

      - name: Download NetHunter Patches
        run: |
          mkdir -p patches/nethunter
          BASE="https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder/-/raw/main/patches/4.14"
          curl -fL -o patches/nethunter/001-add-qcacld-3.0-injection-4.14.patch "$BASE/add-qcacld-3.0-injection-4.14.patch"
          curl -fL -o patches/nethunter/002-add-wifi-injection-4.14.patch "$BASE/add-wifi-injection-4.14.patch"
          curl -fL -o patches/nethunter/003-add-rtw88-drivers-4.14.patch "$BASE/add-rtw88-drivers-4.14.patch"
          ls -lh patches/nethunter/

      - name: Apply NetHunter Patches
        run: |
          for p in patches/nethunter/*.patch; do
            echo "📌 $p"
            patch -p1 --dry-run < "$p" && patch -p1 < "$p" || echo "⚠️ failed: $p"
          done

      - name: Build Kernel (XXKSU + NetHunter)
        env:
          LOG_UPLOAD: 0
        run: |
          export WP="$(realpath "$PWD/..")"
          echo "🚀 Building FloppyKernel XXKSU + NetHunter for Ginkgo..."
          set -o pipefail
          bash build/ckbuild.sh ginkgo x 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: |
            build.log
            out/.config
          if-no-files-found: warn
          overwrite: true

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FloppyKernel-XXKSU-NetHunter-Ginkgo
          path: build/Floppy_*.zip
          if-no-files-found: error
          overwrite: true
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Download NetHunter Patches
        run: |
          mkdir -p patches/nethunter
          cd patches/nethunter

          BASE="https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder/-/raw/main/patches/4.14"

          curl -fL -o 001-add-qcacld-3.0-injection-4.14.patch \
            "$BASE/add-qcacld-3.0-injection-4.14.patch" \
            && echo "✅ 001 OK" || echo "❌ 001 FAIL"

          curl -fL -o 002-add-wifi-injection-4.14.patch \
            "$BASE/add-wifi-injection-4.14.patch" \
            && echo "✅ 002 OK" || echo "❌ 002 FAIL"

          curl -fL -o 003-add-rtw88-drivers-4.14.patch \
            "$BASE/add-rtw88-drivers-4.14.patch" \
            && echo "✅ 003 OK" || echo "❌ 003 FAIL"

          echo ""
          ls -lh

      - name: Apply NetHunter Patches
        run: |
          cd "$GITHUB_WORKSPACE"
          APPLIED=0
          FAILED=0
          FAILED_LIST=()

          echo "🔧 Applying NetHunter patches..."
          echo "========================================="

          for patch_file in patches/nethunter/*.patch; do
            [ -f "$patch_file" ] || continue
            patch_name=$(basename "$patch_file")
            echo ""
            echo "📌 Processing: $patch_name"

            if patch -p1 --dry-run < "$patch_file" &>/dev/null; then
              echo "✅ Dry-run OK with -p1, applying..."
              if patch -p1 < "$patch_file"; then
                echo "✅ Applied: $patch_name"
                APPLIED=$((APPLIED + 1))
              else
                echo "❌ FAILED: $patch_name (p1)"
                FAILED_LIST+=("$patch_name (p1)")
                FAILED=$((FAILED + 1))
              fi
            elif patch -p0 --dry-run < "$patch_file" &>/dev/null; then
              echo "✅ Dry-run OK with -p0, applying..."
              if patch -p0 < "$patch_file"; then
                echo "✅ Applied (p0): $patch_name"
                APPLIED=$((APPLIED + 1))
              else
                echo "❌ FAILED: $patch_name (p0)"
                FAILED_LIST+=("$patch_name (p0)")
                FAILED=$((FAILED + 1))
              fi
            else
              echo "❌ INCOMPATIBLE: $patch_name"
              FAILED_LIST+=("$patch_name (incompatible)")
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "========================================="
          echo "📊 PATCH SUMMARY:"
          echo "✅ Applied: $APPLIED"
          echo "❌ Failed:  $FAILED"
          if [ ${#FAILED_LIST[@]} -gt 0 ]; then
            echo ""
            echo "Failed patches:"
            for p in "${FAILED_LIST[@]}"; do
              echo "  ❌ $p"
            done
          fi
          echo "========================================="

          if [ "$FAILED" -gt 0 ]; then
            echo ""
            echo "⚠️ Some patches failed — continuing anyway so we can see build errors"
          fi

      - name: Verify No .rej Files
        run: |
          cd "$GITHUB_WORKSPACE"
          if find . -name '*.rej' | grep -q .; then
            echo "⚠️ .rej files found:"
            find . -name '*.rej'
            echo ""
            echo "Continuing build — these may not be fatal"
          else
            echo "✅ No .rej files"
          fi

      - name: Inject NetHunter Config
        run: |
          cd "$GITHUB_WORKSPACE"
          echo ""
          echo "📌 Injecting NetHunter config into vendor/ginkgo.config..."
          echo ""

          # Cek dulu apakah config udah ada biar gak dobel
          if grep -q "NETHUNTER_WIFI_INJECTION" vendor/ginkgo.config 2>/dev/null; then
            echo "⚠️ NetHunter config udah ada di vendor/ginkgo.config, skip."
          else
            cat >> vendor/ginkgo.config << 'EOF'

          # ============================================
          # NETHUNTER_WIFI_INJECTION
          # ============================================
          # WiFi / mac80211
          CONFIG_MAC80211=y
          CONFIG_MAC80211_MESH=y
          CONFIG_CFG80211=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_WIRELESS_EXT=y
          CONFIG_WEXT_CORE=y
          CONFIG_WEXT_PROC=y
          CONFIG_WEXT_SPY=y
          CONFIG_WEXT_PRIV=y
          CONFIG_MAC80211_LEDS=y
          CONFIG_MAC80211_DEBUGFS=y

          # Netfilter / iptables
          CONFIG_NETFILTER=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_NAT=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_NF_NAT_IPV6=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP_NF_TARGET_REDIRECT=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_NETFILTER_XT_MATCH=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y

          # USB HID (BadUSB)
          CONFIG_HIDRAW=y
          CONFIG_USB_HIDDEV=y

          # BPF — fix bpf_jit_blinding_enabled
          CONFIG_BPF_JIT=y

          # SMACK off — fix 'isp' undeclared
          # CONFIG_SECURITY_SMACK is not set

          # QCACLD (kalau ada di tree)
          CONFIG_FEATURE_FRAME_INJECTION_SUPPORT=y

          # RTW88
          CONFIG_RTW88=m
          CONFIG_RTW88_PCI=m
          CONFIG_RTW88_USB=m
          CONFIG_RTW88_SDIO=m
          CONFIG_RTW88_CORE=m
          EOF
            echo "✅ NetHunter config injected"
          fi

          echo ""
          echo "📋 Verifying config tail:"
          tail -50 vendor/ginkgo.config

      - name: Build Kernel (XXKSU + NetHunter WiFi)
        run: |
          cd "$GITHUB_WORKSPACE"
          export WP="$(realpath "$PWD/..")"

          echo ""
          echo "🚀 Building FloppyKernel XXKSU + NetHunter WiFi..."
          echo "Device: Ginkgo (Redmi Note 8)"
          echo "========================================="

          # Capture log sambil jalan
          set -o pipefail
          bash build/ckbuild.sh ginkgo x 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: |
            build.log
            out/.config
          if-no-files-found: warn
          overwrite: true

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FloppyKernel-XXKSU-NetHunter-WiFi-Ginkgo
          path: build/Floppy_*.zip
          if-no-files-found: error
          overwrite: true

      - name: Build Summary
        if: always()
        run: |
          echo ""
          echo "🎉 Build Workflow Complete!"
          echo "========================================="
          echo "Device: Ginkgo (Redmi Note 8)"
          echo "Variant: XXKSU + NetHunter WiFi Injection"
          echo "========================================="
