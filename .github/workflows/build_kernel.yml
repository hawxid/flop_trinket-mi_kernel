name: Build FlopKernel Ginkgo/Willow (ReSuKisu + NetHunter QCACLD)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4

      - name: Setup Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev libglib2.0-dev zip curl git ccache

      - name: Download Proton Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/proton-clang

      - name: Inject ReSuKisu KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/rsunt/KernelSU/main/kernel/setup.sh" | bash -

      - name: Fetch and Apply NetHunter & QCACLD 3.0 Patches
        run: |
          PATCH_URL="https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder/-/raw/main/patches/4.14"

          # Unduh Patch QCACLD-3.0 Wi-Fi Injection & NetHunter Wireless/HID
          curl -LSs "$PATCH_URL/add-qcacld-3.0-injection-4.14.patch" -o qcacld30.patch
          curl -LSs "$PATCH_URL/add-wifi-injection-4.14.patch" -o wifi_inject.patch

          # Apply Patch dengan mekanisme fallback (patch -p1)
          git apply --check qcacld30.patch && git apply qcacld30.patch || patch -p1 < qcacld30.patch || true
          git apply --check wifi_inject.patch && git apply wifi_inject.patch || patch -p1 < wifi_inject.patch || true

      - name: Patch Defconfig (QCACLD + NetHunter + Droidspace + KVM + ReSuKisu)
        run: |
          DEFCONFIG="arch/arm64/configs/ginkgo_defconfig"

          # --- ReSuKisu / KernelSU Config ---
          scripts/config --file $DEFCONFIG -e CONFIG_KSU
          scripts/config --file $DEFCONFIG -e CONFIG_KSU_TAMPER_SYS_PROC_NODES

          # --- NetHunter HID Keyboard/Mouse & Packet Injection ---
          scripts/config --file $DEFCONFIG -e CONFIG_USB_CONFIGFS_F_HID
          scripts/config --file $DEFCONFIG -e CONFIG_MAC80211
          scripts/config --file $DEFCONFIG -e CONFIG_CFG80211
          scripts/config --file $DEFCONFIG -e CONFIG_CFG80211_INTERNAL_REGDB

          # --- Flag QCACLD-3.0 Monitor Mode & Frame Injection ---
          scripts/config --file $DEFCONFIG -e CONFIG_QCACLD_WLAN_LFR3
          scripts/config --file $DEFCONFIG -m CONFIG_QCACLD_WLAN

          # --- Droidspace / Container (Namespaces, CGroups, OverlayFS, VETH) ---
          scripts/config --file $DEFCONFIG -e CONFIG_NAMESPACES
          scripts/config --file $DEFCONFIG -e CONFIG_USER_NS
          scripts/config --file $DEFCONFIG -e CONFIG_PID_NS
          scripts/config --file $DEFCONFIG -e CONFIG_NET_NS
          scripts/config --file $DEFCONFIG -e CONFIG_CGROUPS
          scripts/config --file $DEFCONFIG -e CONFIG_MEMCG
          scripts/config --file $DEFCONFIG -e CONFIG_CGROUP_FREEZER
          scripts/config --file $DEFCONFIG -e CONFIG_CGROUP_DEVICE
          scripts/config --file $DEFCONFIG -e CONFIG_OVERLAY_FS
          scripts/config --file $DEFCONFIG -e CONFIG_VETH
          scripts/config --file $DEFCONFIG -e CONFIG_BRIDGE

          # --- KVM / Virtualization (ARM64) ---
          scripts/config --file $DEFCONFIG -e CONFIG_VIRTUALIZATION
          scripts/config --file $DEFCONFIG -e CONFIG_KVM
          scripts/config --file $DEFCONFIG -e CONFIG_KVM_ARM_HOST

      - name: Compile Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out ginkgo_defconfig
          make -j$(nproc --all) O=out

      - name: Pack with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          cp out/arch/arm64/boot/Image.gz-dtb AK3/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AK3/
          cd AK3
          zip -r9 "../FlopKernel-Ginkgo-NetHunter-QCACLD3-ReSuKisu.zip" * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlopKernel-Ginkgo-NetHunter-QCACLD3
          path: FlopKernel-Ginkgo-NetHunter-QCACLD3-ReSuKisu.zip
