name: Build Kernel Floppy + BPF Fix (FINAL)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: floppy-unity

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison flex libssl-dev libelf-dev python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi patch

      - name: Fix source patches
        run: |
          sed -i '1s/^/#include <asm\/setup.h>\n/' fs/proc/cmdline.c

      - name: Download toolchain
        run: |
          mkdir -p ~/toolchain
          git clone --depth=1 https://github.com/ZyCromerZ/Clang --single-branch ~/toolchain/clang

      - name: Clone Kali NetHunter kernel patches
        run: |
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder.git ~/nethunter-patches
          ls -la ~/nethunter-patches/patches/4.14/

      - name: Apply NetHunter patches (exclude Samsung & problematic)
        run: |
          cd ~/nethunter-patches/patches/4.14/
          EXCLUDE_PATCHES="samsung|oneui|fix-yylloc|add-rtl8188eus"
          PATCH_FILES=$(ls *.patch | grep -viE "$EXCLUDE_PATCHES")
          for patch in $PATCH_FILES; do
            echo "📌 Menerapkan patch: $patch"
            patch -d $GITHUB_WORKSPACE -p1 < "$patch" 2>/dev/null || \
            patch -d $GITHUB_WORKSPACE -p0 < "$patch" 2>/dev/null || \
            echo "⚠️ Patch $patch gagal, dilanjutkan"
          done

      - name: Build kernel dengan BPF fix
        run: |
          export PATH="$HOME/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          mkdir -p out
          
          # 1. Defconfig dasar
          make O=out ARCH=arm64 ginkgo-stock_defconfig
          
          # 2. Tambahkan XXKSU
          if [ -f arch/arm64/configs/xxksu.config ]; then
            echo "📌 Menambahkan XXKSU config"
            cat arch/arm64/configs/xxksu.config >> out/.config
          fi
          
          # 3. Tambahkan DroidSpaces
          if [ -f arch/arm64/configs/droidspaces.config ]; then
            echo "📌 Menambahkan DroidSpaces config"
            cat arch/arm64/configs/droidspaces.config >> out/.config
          fi
          
          # 👇 PERBAIKAN BPF: Hapus konflik dan tambahkan ulang
          echo "# BPF fix - remove conflicts" >> out/.config
          sed -i '/CONFIG_BPF_JIT/d' out/.config
          sed -i '/CONFIG_BPF_SYSCALL/d' out/.config
          sed -i '/CONFIG_HAVE_EBPF_JIT/d' out/.config
          sed -i '/CONFIG_BPF_JIT_ALWAYS_ON/d' out/.config
          
          echo 'CONFIG_BPF_JIT=y' >> out/.config
          echo 'CONFIG_BPF_SYSCALL=y' >> out/.config
          echo 'CONFIG_HAVE_EBPF_JIT=y' >> out/.config
          echo 'CONFIG_BPF_JIT_ALWAYS_ON=y' >> out/.config
          
          # 👇 PERBAIKAN SMACK
          echo '# CONFIG_SECURITY_SMACK is not set' >> out/.config
          
          # 👇 Opsi NetHunter
          echo '# NetHunter options' >> out/.config
          echo 'CONFIG_NETFILTER=y' >> out/.config
          echo 'CONFIG_NF_NAT=y' >> out/.config
          echo 'CONFIG_NETFILTER_XT_MATCH=y' >> out/.config
          echo 'CONFIG_IP_NF=y' >> out/.config
          echo 'CONFIG_IP6_NF=y' >> out/.config
          echo 'CONFIG_NF_NAT_IPV4=y' >> out/.config
          echo 'CONFIG_NF_NAT_IPV6=y' >> out/.config
          echo 'CONFIG_HIDRAW=y' >> out/.config
          echo 'CONFIG_USB_HIDDEV=y' >> out/.config
          echo 'CONFIG_MAC80211=y' >> out/.config
          echo 'CONFIG_CFG80211=y' >> out/.config
          echo 'CONFIG_IP_NF_TARGET_MASQUERADE=y' >> out/.config
          echo 'CONFIG_IP_NF_TARGET_REDIRECT=y' >> out/.config
          echo 'CONFIG_IP_NF_NAT=y' >> out/.config
          
          # Opsi khusus ginkgo
          echo 'CONFIG_LITTLE_CPU_MASK=63' >> out/.config
          echo 'CONFIG_BIG_CPU_MASK=192' >> out/.config
          
          # 👇 Refresh konfigurasi
          make O=out ARCH=arm64 olddefconfig
          
          # 👇 VERIFIKASI BPF
          echo "# Verifikasi konfigurasi BPF setelah olddefconfig" >> out/.config
          if ! grep -q "CONFIG_BPF_JIT=y" out/.config; then
            echo "❌ CONFIG_BPF_JIT tidak aktif! Memaksa lagi..."
            sed -i 's/.*CONFIG_BPF_JIT.*/CONFIG_BPF_JIT=y/g' out/.config
            sed -i 's/.*CONFIG_BPF_SYSCALL.*/CONFIG_BPF_SYSCALL=y/g' out/.config
            sed -i 's/.*CONFIG_HAVE_EBPF_JIT.*/CONFIG_HAVE_EBPF_JIT=y/g' out/.config
          fi
          
          # 👇 TAMBAHKAN WORKAROUND: Deklarasi fungsi yang hilang
          echo "// BPF workaround: add missing function declaration" >> include/linux/filter.h
          echo "static inline bool bpf_jit_blinding_enabled(struct bpf_prog *prog) { return bpf_jit_kallsyms_enabled() && prog->jit_requested; }" >> include/linux/filter.h
          
          # 👇 Refresh sekali lagi
          make O=out ARCH=arm64 olddefconfig
          
          # 👇 Build kernel
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../FloppyKernel-BPF-FIXED.zip . -x '*.git*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloppyKernel-BPF-FIXED
          path: FloppyKernel-BPF-FIXED.zip
