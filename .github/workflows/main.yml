name: Build FloppyKernel (Official Script)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: floppy-unity

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison flex libssl-dev libelf-dev python3 zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi ccache wget curl cpio

      - name: Fix ckbuild.sh (perbaiki source path)
        run: |
          # Perbaiki baris source log.sh
          sed -i 's/source "${pwd}/source "$(pwd)/g' build/ckbuild.sh
          
          # Tampilkan isi ckbuild.sh untuk verifikasi
          head -20 build/ckbuild.sh

      - name: Build kernel with XXKSU (tanpa Telegram)
        run: |
          # Set environment variables yang dibutuhkan script
          export WP=$(realpath $PWD/../)
          
          # Jalankan script resmi dengan XXKSU (-x)
          # HAPUS argumen -t untuk menonaktifkan upload Telegram
          # HAPUS argumen -o untuk menonaktifkan 0x0.st upload
          ./build/ckbuild.sh ginkgo -x

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloppyKernel-XXKSU
          path: build/Floppy_*.zip
