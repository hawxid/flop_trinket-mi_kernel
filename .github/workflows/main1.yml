name: Build FloppyKernel (Pure - Test Build)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison flex libssl-dev libelf-dev libncurses-dev python3 zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi ccache wget curl cpio

      - name: Fix permission scripts
        run: |
          chmod +x build/ckbuild.sh
          chmod +x build/scripts/*.sh
          chmod +x build/lib/*.sh 2>/dev/null || true

      - name: Build kernel (pure, tanpa patch apapun)
        env:
          LOG_UPLOAD: 0
        run: |
          export WP="$(realpath "$PWD/..")"
          # Build standar dengan XXKSU (atau tanpa -x kalau mau vanilla)
          ./build/ckbuild.sh ginkgo -x

      - name: Prepare build artifact
        run: |
          shopt -s nullglob
          archives=(build/Floppy_*.zip)
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one kernel ZIP, found ${#archives[@]}"
            printf '%s\n' "${archives[@]}"
            exit 1
          fi
          mv -- "${archives[0]}" FloppyKernel-Pure.zip
          zip -T FloppyKernel-Pure.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloppyKernel-Pure
          path: FloppyKernel-Pure.zip
          if-no-files-found: error
