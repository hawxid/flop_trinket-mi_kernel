name: Build FloppyKernel + NetHunter (XXKSU) - All Patches

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: floppy-unity

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison flex libssl-dev libelf-dev python3 zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi ccache wget curl cpio patch

      - name: Fix ckbuild.sh dan beri izin eksekusi
        run: |
          sed -i 's/source "${pwd}/source "$(pwd)/g' build/ckbuild.sh
          chmod +x build/ckbuild.sh
          chmod +x build/scripts/*.sh

      - name: Clone & apply NetHunter patches
        run: |
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder.git ~/nethunter-patches
          cd ~/nethunter-patches/patches/4.14/
          
          # 👇 DAFTAR PATCH YANG AKAN DITERAPKAN
          # Semua patch kecuali Samsung/OneUI
          for patch in $(ls *.patch | grep -viE 'samsung|oneui|hcionfig'); do
            echo "📌 Applying: $patch"
            
            # Coba dengan -p1, jika gagal coba -p0
            if patch -d $GITHUB_WORKSPACE -p1 < "$patch" 2>/dev/null; then
              echo "✅ $patch berhasil diterapkan (p1)"
            elif patch -d $GITHUB_WORKSPACE -p0 < "$patch" 2>/dev/null; then
              echo "✅ $patch berhasil diterapkan (p0)"
            else
              echo "⚠️ $patch gagal diterapkan, dilewati"
            fi
          done
          
          echo "📋 Ringkasan patch yang gagal (reject files):"
          find $GITHUB_WORKSPACE -name "*.rej" 2>/dev/null | wc -l | xargs echo "Jumlah reject files:"

      - name: Build kernel with XXKSU + NetHunter
        run: |
          export WP=$(realpath $PWD/../)
          ./build/ckbuild.sh ginkgo -x

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloppyKernel-XXKSU-NetHunter-AllPatches
          path: build/Floppy_*.zip
