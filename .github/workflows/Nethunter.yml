name: Build FloppyKernel + XXKSU + NetHunter (GCC)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: floppy-unity

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison flex libssl-dev libelf-dev python3 zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi ccache wget curl cpio patch

      - name: Fix ckbuild.sh dan beri izin eksekusi
        run: |
          sed -i 's/source "${pwd}/source "$(pwd)/g' build/ckbuild.sh
          chmod +x build/ckbuild.sh
          chmod +x build/scripts/*.sh
          chmod +x build/lib/*.sh 2>/dev/null || true

      - name: Clone & apply NetHunter patches
        run: |
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder.git ~/nethunter-patches
          cd ~/nethunter-patches/patches/4.14/
          for patch in $(ls *.patch | grep -viE 'samsung|oneui|hcionfig'); do
            echo "📌 Applying: $patch"
            patch -d $GITHUB_WORKSPACE -p1 < "$patch" 2>/dev/null || \
            patch -d $GITHUB_WORKSPACE -p0 < "$patch" 2>/dev/null || \
            echo "⚠️ $patch failed, skipped"
          done

      - name: Build kernel + NetHunter (GCC, tanpa ld.lld)
        run: |
          export WP=$(realpath $PWD/../)
          # Build awal pake Clang (biar ckbuild.sh jalan)
          ./build/ckbuild.sh ginkgo -x
          
          # Tambah opsi NetHunter + matiin LTO + matiin VDSO
          echo "# NETHUNTER" >> out/.config
          echo 'CONFIG_NETFILTER=y' >> out/.config
          echo 'CONFIG_NF_NAT=y' >> out/.config
          echo 'CONFIG_NETFILTER_XT_MATCH=y' >> out/.config
          echo 'CONFIG_IP_NF=y' >> out/.config
          echo 'CONFIG_IP6_NF=y' >> out/.config
          echo 'CONFIG_NF_NAT_IPV4=y' >> out/.config
          echo 'CONFIG_NF_NAT_IPV6=y' >> out/.config
          echo 'CONFIG_IP_NF_TARGET_MASQUERADE=y' >> out/.config
          echo 'CONFIG_IP_NF_TARGET_REDIRECT=y' >> out/.config
          echo 'CONFIG_IP_NF_NAT=y' >> out/.config
          echo 'CONFIG_HID=y' >> out/.config
          echo 'CONFIG_HIDRAW=y' >> out/.config
          echo 'CONFIG_UHID=y' >> out/.config
          echo 'CONFIG_USB_HID=y' >> out/.config
          echo 'CONFIG_USB_HIDDEV=y' >> out/.config
          echo 'CONFIG_HID_GENERIC=y' >> out/.config
          echo 'CONFIG_MAC80211=y' >> out/.config
          echo 'CONFIG_CFG80211=y' >> out/.config
          echo 'CONFIG_ATH9K_HTC=y' >> out/.config
          echo 'CONFIG_ATH9K_HTC_DEBUGFS=y' >> out/.config
          echo 'CONFIG_RTL8188EU=y' >> out/.config
          echo 'CONFIG_RTL8812AU=y' >> out/.config
          echo 'CONFIG_RTL88XXAU=y' >> out/.config
          echo 'CONFIG_BT_RFCOMM=y' >> out/.config
          echo 'CONFIG_BT_RFCOMM_TTY=y' >> out/.config
          echo 'CONFIG_BT_BNEP=y' >> out/.config
          echo 'CONFIG_BT_HIDP=y' >> out/.config
          echo 'CONFIG_BT_HCIVHCI=y' >> out/.config
          echo 'CONFIG_BT_L2CAP=y' >> out/.config
          echo 'CONFIG_BT_HCIUART=y' >> out/.config
          echo 'CONFIG_BT_HCIUART_H4=y' >> out/.config
          echo 'CONFIG_BT_BCM=y' >> out/.config
          echo 'CONFIG_BT_RTL=y' >> out/.config
          echo 'CONFIG_BT_QCA=y' >> out/.config
          echo 'CONFIG_BT_MTK=y' >> out/.config
          echo 'CONFIG_BT_INTEL=y' >> out/.config
          echo 'CONFIG_USB_GADGET=y' >> out/.config
          echo 'CONFIG_USB_CONFIGFS=y' >> out/.config
          echo 'CONFIG_USB_CONFIGFS_ACM=y' >> out/.config
          echo 'CONFIG_USB_CONFIGFS_OBEX=y' >> out/.config
          echo 'CONFIG_USB_CONFIGFS_NCM=y' >> out/.config
          echo 'CONFIG_USB_CONFIGFS_ECM=y' >> out/.config
          echo 'CONFIG_USB_CONFIGFS_ECM_SUBSET=y' >> out/.config
          echo 'CONFIG_USB_CONFIGFS_RNDIS=y' >> out/.config
          echo 'CONFIG_USB_CONFIGFS_EEM=y' >> out/.config
          echo 'CONFIG_USB_CONFIGFS_PHONET=y' >> out/.config
          echo 'CONFIG_USB_CONFIGFS_MASS_STORAGE=y' >> out/.config
          echo 'CONFIG_USB_CONFIGFS_F_LB_SS=y' >> out/.config
          echo 'CONFIG_USB_CONFIGFS_F_FS=y' >> out/.config
          echo 'CONFIG_USB_CONFIGFS_UEVENT=y' >> out/.config
          echo 'CONFIG_ANDROID_BINDER_IPC=y' >> out/.config
          echo 'CONFIG_NFS_FS=y' >> out/.config
          echo 'CONFIG_NFS_V3=y' >> out/.config
          echo 'CONFIG_NFS_V4=y' >> out/.config
          echo 'CONFIG_CIFS=y' >> out/.config
          echo 'CONFIG_FUSE_FS=y' >> out/.config
          echo 'CONFIG_CAN=y' >> out/.config
          echo 'CONFIG_CAN_RAW=y' >> out/.config
          echo 'CONFIG_CAN_BCM=y' >> out/.config
          echo 'CONFIG_CAN_GW=y' >> out/.config
          echo 'CONFIG_CAN_VCAN=m' >> out/.config
          echo 'CONFIG_CAN_SLCAN=m' >> out/.config
          echo 'CONFIG_CAN_DEV=y' >> out/.config
          echo 'CONFIG_CAN_CALC_BITTIMING=y' >> out/.config
          echo 'CONFIG_BPF_JIT=y' >> out/.config
          echo 'CONFIG_BPF_SYSCALL=y' >> out/.config
          echo 'CONFIG_HAVE_EBPF_JIT=y' >> out/.config
          echo 'CONFIG_BPF_JIT_ALWAYS_ON=y' >> out/.config
          echo '# CONFIG_SECURITY_SMACK is not set' >> out/.config
          
          # MATIKAN LTO & VDSO (ini penting!)
          echo '# CONFIG_LTO_CLANG is not set' >> out/.config
          echo '# CONFIG_LTO_NONE is not set' >> out/.config
          echo 'CONFIG_LTO_NONE=y' >> out/.config
          echo '# CONFIG_LTO is not set' >> out/.config
          echo '# CONFIG_VDSO is not set' >> out/.config
          echo 'CONFIG_VDSO=n' >> out/.config
          
          # Refresh config
          make O=out ARCH=arm64 olddefconfig
          
          # BUILD ULANG PAKE GCC (bukan Clang) - otomatis pake aarch64-linux-gnu-ld
          make -j$(nproc) O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/Flopster101/AnyKernel3 -b floppy-unity AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../FloppyKernel-XXKSU-NetHunter-GCC.zip . -x '*.git*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloppyKernel-XXKSU-NetHunter-GCC
          path: FloppyKernel-XXKSU-NetHunter-GCC.zip
