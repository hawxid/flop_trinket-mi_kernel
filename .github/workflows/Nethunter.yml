name: Build FloppyKernel + XXKSU + NetHunter (ALL-IN-ONE)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison flex libssl-dev libelf-dev libncurses-dev python3 zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi ccache wget curl cpio patch

      - name: Fix script permissions
        run: |
          chmod +x build/ckbuild.sh
          chmod +x build/scripts/*.sh
          chmod +x build/lib/*.sh 2>/dev/null || true

      # ============================================
      # STEP 1: APPLY NETHUNTER PATCHES
      # ============================================
      - name: Clone & apply NetHunter patches (skip Samsung)
        run: |
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder.git ~/nethunter-patches
          patch_dir="$HOME/nethunter-patches/patches/4.14"
          test -d "$patch_dir"

          while IFS= read -r -d '' patch_file; do
            patch="${patch_file##*/}"
            echo "📌 Applying: $patch"
            patch -d "$GITHUB_WORKSPACE" -p1 < "$patch_file" 2>/dev/null || \
            patch -d "$GITHUB_WORKSPACE" -p0 < "$patch_file" 2>/dev/null || \
            echo "⚠️ $patch failed, skipped"
          done < <(find "$patch_dir" -maxdepth 1 -type f -name '*.patch' \
            ! -iname '*samsung*' ! -iname '*oneui*' ! -iname '*hcionfig*' -print0 | sort -z)

      # ============================================
      # STEP 2: PATCH DROIDSPACES.CONFIG DENGAN SEMUA OPSI NETHUNTER
      # ============================================
      - name: Patch droidspaces.config dengan NetHunter options
        run: |
          echo "🔧 Menambahkan semua opsi NetHunter ke droidspaces.config..."
          
          cat >> arch/arm64/configs/droidspaces.config <<'EOF'
          
          # ==========================================
          # NETHUNTER FULL OPTIONS
          # ==========================================
          
          # ---- NETFILTER & FIREWALL ----
          CONFIG_NETFILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NETFILTER_XT_MATCH=y
          CONFIG_IP_NF=y
          CONFIG_IP6_NF=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_NF_NAT_IPV6=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP_NF_TARGET_REDIRECT=y
          CONFIG_IP_NF_NAT=y
          
          # ---- HID (DuckHunter) ----
          CONFIG_HID=y
          CONFIG_HIDRAW=y
          CONFIG_UHID=y
          CONFIG_USB_HID=y
          CONFIG_USB_HIDDEV=y
          CONFIG_HID_GENERIC=y
          
          # ---- TCP/IP TOOLS ----
          CONFIG_NETTOOLS=y
          
          # ---- TCPDUMP/NETDUMP ----
          CONFIG_PACKET=y
          CONFIG_PACKET_DIAG=y
          CONFIG_NETFILTER_NETLINK=y
          CONFIG_NETFILTER_NETLINK_ACCT=y
          CONFIG_NETFILTER_NETLINK_QUEUE=y
          
          # ---- NFQUEUE ----
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NETFILTER_XT_TARGET_NFQUEUE=y
          
          # ---- IPTABLES ----
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_TARGET_LOG=y
          
          # ---- IP6TABLES ----
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_IP6_NF_TARGET_LOG=y
          
          # ---- TPROXY ----
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          
          # ---- MARK ----
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_NETFILTER_XT_TARGET_MARK=y
          
          # ---- CONNTRACK ----
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_CONNTRACK_IPV6=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_STATE=y
          CONFIG_NETFILTER_XT_MATCH_LIMIT=y
          
          # ---- LOG ----
          CONFIG_NETFILTER_XT_MATCH_PKTTYPE=y
          
          # ---- GEOIP (optional - may need compilation) ----
          # CONFIG_NETFILTER_XT_MATCH_GEOIP is not set
          
          # ---- Additional modules ----
          CONFIG_NF_CONNTRACK_MARK=y
          CONFIG_NF_CONNTRACK_SECMARK=y
          CONFIG_NETFILTER_XT_CONNMARK=y
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
          CONFIG_NETFILTER_XT_MATCH_TCPMSS=y
          CONFIG_IP_NF_TARGET_ULOG=y
          CONFIG_NF_NAT_NEEDED=y
          CONFIG_NF_NAT_PROTO_GRE=y
          
          # ---- WIRELESS INJECTION ----
          CONFIG_MAC80211=y
          CONFIG_CFG80211=y
          CONFIG_RFKILL=y
          CONFIG_CFG80211_ALLOW_RECONNECT=y
          
          # ---- WIRELESS MONITOR ----
          CONFIG_NL80211_TESTMODE=y
          
          # ---- WIRELESS TOOLS ----
          CONFIG_WEXT_CORE=y
          CONFIG_WEXT_PRIV=y
          
          # ---- DEBUGFS ----
          CONFIG_DEBUG_FS=y
          
          # ---- PERF ----
          CONFIG_PERF_EVENTS=y
          CONFIG_DEBUG_PERF_USE_VMALLOC=y
          
          # ---- SYSCALL TRACING ----
          CONFIG_HAVE_SYSCALL_TRACEPOINTS=y
          CONFIG_FTRACE=y
          CONFIG_FUNCTION_TRACER=y
          CONFIG_FTRACE_SYSCALLS=y
          CONFIG_TRACER_MAX_TRACE=y
          CONFIG_TRACE_SYSCALLS=y
          
          # ---- BPF ----
          CONFIG_BPF=y
          CONFIG_HAVE_BPF_JIT=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_HAVE_EBPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          
          # ---- DISABLE SMACK ----
          # CONFIG_SECURITY_SMACK is not set
          
          # ---- DISABLE LTO & VDSO ----
          # CONFIG_LTO_CLANG is not set
          CONFIG_LTO_NONE=y
          # CONFIG_LTO is not set
          # CONFIG_VDSO is not set
          
          # ==========================================
          # END NETHUNTER OPTIONS
          # ==========================================
          EOF
          
          echo "✅ droidspaces.config berhasil di-patch!"

      # ============================================
      # STEP 3: BUILD DENGAN SCRIPT RESMI (SEMUA DALAM SATU SHELL)
      # ============================================
      - name: Build kernel dengan XXKSU + NetHunter
        env:
          LOG_UPLOAD: 0
        run: |
          export WP="$(realpath "$PWD/..")"
          
          echo "🚀 Memulai build dengan XXKSU + NetHunter..."
          
          # Jalankan build resmi dengan XXKSU
          # Semua opsi NetHunter sudah ada di droidspaces.config (akan otomatis di-load)
          ./build/ckbuild.sh ginkgo -x

      - name: Prepare build artifact
        run: |
          shopt -s nullglob
          archives=(build/Floppy_*.zip)
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one kernel ZIP, found ${#archives[@]}"
            printf '%s\n' "${archives[@]}"
            exit 1
          fi
          mv -- "${archives[0]}" FloppyKernel-XXKSU-NetHunter-ALLINONE.zip
          zip -T FloppyKernel-XXKSU-NetHunter-ALLINONE.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloppyKernel-XXKSU-NetHunter-ALLINONE
          path: FloppyKernel-XXKSU-NetHunter-ALLINONE.zip
          if-no-files-found: error
