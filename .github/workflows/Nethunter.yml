name: Build FloppyKernel XXKSU (Ginkgo Test)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex libssl-dev libelf-dev \
            libncurses-dev python3 zip curl ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fix Script Permissions
        run: |
          chmod +x build/ckbuild.sh
          chmod +x build/scripts/*.sh
          chmod +x build/lib/*.sh 2>/dev/null || true

      - name: Build Kernel (XXKSU, no NetHunter)
        env:
          LOG_UPLOAD: 0
        run: |
          export WP="$(realpath "$PWD/..")"
          echo "🚀 Building FloppyKernel XXKSU for Ginkgo..."
          bash build/ckbuild.sh ginkgo x

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloppyKernel-XXKSU-Ginkgo
          path: build/Floppy_*.zip
          if-no-files-found: error
          overwrite: true
